{% extends "base.html" %}
{% block title %}獨居老人生活管家 — 首頁{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-3 fw-bold text-primary mb-3">
        <i class="bi bi-house-heart-fill"></i>
    </h1>
    <h1 class="display-5 fw-bold mb-3">獨居老人生活管家</h1>
    <p class="lead text-muted mb-5">每日關懷、事項提醒、緊急求助 — 讓家人安心的守護系統</p>

    <div class="row justify-content-center g-4 mb-5">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center p-4">
                    <div class="display-4 text-success mb-3"><i class="bi bi-check-circle-fill"></i></div>
                    <h5 class="fw-bold">每日回報</h5>
                    <p class="text-muted">長者每天按下「我很好」，家屬即時掌握安全狀態</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center p-4">
                    <div class="display-4 text-warning mb-3"><i class="bi bi-bell-fill"></i></div>
                    <h5 class="fw-bold">事項提醒</h5>
                    <p class="text-muted">用藥、回診、日常事務，系統準時提醒不遺忘</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center p-4">
                    <div class="display-4 text-danger mb-3"><i class="bi bi-exclamation-triangle-fill"></i></div>
                    <h5 class="fw-bold">緊急求助</h5>
                    <p class="text-muted">一鍵發送緊急通報，第一時間通知家屬</p>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg px-5">
            <i class="bi bi-box-arrow-in-right"></i> 登入
        </a>
        <a href="{{ url_for('auth.register') }}" class="btn btn-outline-primary btn-lg px-5">
            <i class="bi bi-person-plus"></i> 註冊
        </a>
    </div>
</div>
{% endblock %}
