{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
                <h3 class="mb-0">綁定長者帳號</h3>
            </div>
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <p class="text-muted fs-5">請在長者登入首頁查看 <strong>6 位數綁定碼</strong>，並輸入於下方建立綁定關係。</p>
                </div>
                <form action="{{ url_for('family.bind') }}" method="POST">
                    <div class="mb-4">
                        <label class="form-label fs-5 fw-bold">長者綁定碼</label>
                        <input type="text" name="elder_code" class="form-control form-control-lg text-center fs-3 fw-bold bg-light" placeholder="例如：AB1234" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm">確認綁定</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
