{% extends "base.html" %}
{% block title %}主頁 — 獨居老人生活管家{% endblock %}

{% block content %}
<div class="text-center mt-3 mb-5">
    <h2 class="fw-bold">您好，{{ session.get('display_name') }}</h2>
    <p class="text-muted fs-5">今天感覺如何呢？</p>
</div>

<div class="row justify-content-center g-4 max-w-800 mx-auto">
    <!-- 每日回報大按鈕 -->
    <div class="col-12 col-md-6">
        <form action="{{ url_for('elder.daily_report') }}" method="POST" class="h-100">
            <input type="hidden" name="status" value="safe">
            <button type="submit" class="btn {% if reported_today %}btn-success{% else %}btn-outline-success{% endif %} btn-elder-action w-100 h-100 shadow-sm" {% if reported_today %}disabled{% endif %}>
                <div class="display-1 mb-3">
                    {% if reported_today %}
                        <i class="bi bi-check-circle-fill"></i>
                    {% else %}
                        <i class="bi bi-emoji-smile"></i>
                    {% endif %}
                </div>
                <h1 class="fw-bold mb-0">
                    {% if reported_today %}今日已回報{% else %}我很好{% endif %}
                </h1>
                {% if not reported_today %}
                    <p class="mt-2 fs-5 mb-0">讓家人放心</p>
                {% endif %}
            </button>
        </form>
    </div>

    <!-- 查看提醒大按鈕 -->
    <div class="col-12 col-md-6">
        <a href="{{ url_for('elder.reminders') }}" class="btn btn-outline-info btn-elder-action w-100 h-100 shadow-sm d-flex flex-column align-items-center justify-content-center text-decoration-none">
            <div class="display-1 mb-3 position-relative">
                <i class="bi bi-list-check"></i>
                {% if pending_count > 0 %}
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 1.5rem;">
                        {{ pending_count }}
                    </span>
                {% endif %}
            </div>
            <h1 class="fw-bold mb-0">看提醒</h1>
            <p class="mt-2 fs-5 mb-0">吃藥、回診時間</p>
        </a>
    </div>

    <!-- 緊急求助大按鈕 -->
    <div class="col-12 mt-5">
        <form action="{{ url_for('elder.emergency') }}" method="POST" onsubmit="return confirm('確定要發送緊急通知給家屬嗎？');">
            <button type="submit" class="btn btn-danger btn-elder-emergency w-100 shadow">
                <div class="display-1 mb-2"><i class="bi bi-exclamation-triangle-fill"></i></div>
                <h1 class="display-3 fw-bold mb-0">緊急求助</h1>
                <p class="fs-4 mt-2 mb-0">通知家屬我需要幫忙</p>
            </button>
        </form>
    </div>
</div>
{% endblock %}
