{% extends "base.html" %}
{% block title %}登入 — 獨居老人生活管家{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm mt-5">
            <div class="card-body p-5">
                <h3 class="text-center fw-bold mb-4">
                    <i class="bi bi-box-arrow-in-right text-primary"></i> 登入系統
                </h3>
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">帳號</label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">密碼</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">登入</button>
                </form>
                <hr class="my-4">
                <p class="text-center mb-0">還沒有帳號？ <a href="{{ url_for('auth.register') }}" class="text-decoration-none">立即註冊</a></p>
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
                <h2 class="mb-0">系統登入</h2>
            </div>
            <div class="card-body p-5">
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-4">
                        <label class="form-label fs-4">帳號</label>
                        <input type="text" name="username" class="form-control form-control-lg bg-light" required>
                    </div>
                    <div class="mb-5">
                        <label class="form-label fs-4">密碼</label>
                        <input type="password" name="password" class="form-control form-control-lg bg-light" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 fs-4 fw-bold rounded-pill">登入</button>
                </form>
                <div class="mt-4 text-center">
                    <a href="{{ url_for('auth.register') }}" class="fs-5 text-decoration-none">還沒有帳號？前往註冊</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
