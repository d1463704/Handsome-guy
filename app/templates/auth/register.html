{% extends "base.html" %}
{% block title %}註冊 — 獨居老人生活管家{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm mt-4">
            <div class="card-body p-5">
                <h3 class="text-center fw-bold mb-4">
                    <i class="bi bi-person-plus text-primary"></i> 註冊帳號
                </h3>
                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">您的角色身份（必填）</label>
                        <div class="d-flex gap-3">
                            <div class="form-check border rounded p-3 flex-fill text-center bg-light">
                                <input class="form-check-input float-none mx-auto mb-2" type="radio" name="role" id="roleElder" value="elder" required>
                                <label class="form-check-label d-block fw-bold" for="roleElder">👴 長者</label>
                                <small class="text-muted">需要被照顧</small>
                            </div>
                            <div class="form-check border rounded p-3 flex-fill text-center bg-light">
                                <input class="form-check-input float-none mx-auto mb-2" type="radio" name="role" id="roleFamily" value="family">
                                <label class="form-check-label d-block fw-bold" for="roleFamily">👨‍👩‍👧 家屬</label>
                                <small class="text-muted">照顧長者</small>
                            </div>
                            <div class="form-check border rounded p-3 flex-fill text-center bg-light">
                                <input class="form-check-input float-none mx-auto mb-2" type="radio" name="role" id="roleNurse" value="nurse">
                                <label class="form-check-label d-block fw-bold" for="roleNurse">🏥 護工</label>
                                <small class="text-muted">專業照護</small>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label">帳號（必填）</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="col-md-6">
                            <label for="display_name" class="form-label">姓名/暱稱（必填）</label>
                            <input type="text" class="form-control" id="display_name" name="display_name" placeholder="例：王阿公 / 小明" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label">密碼（必填，至少 4 碼）</label>
                            <input type="password" class="form-control" id="password" name="password" minlength="4" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label">確認密碼（必填）</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="4" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="phone" class="form-label">聯絡電話（選填）</label>
                        <input type="tel" class="form-control" id="phone" name="phone">
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">註冊</button>
                </form>
                <hr class="my-4">
                <p class="text-center mb-0">已經有帳號？ <a href="{{ url_for('auth.login') }}" class="text-decoration-none">登入系統</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
