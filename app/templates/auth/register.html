{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-success text-white text-center py-3 rounded-top-4">
                <h2 class="mb-0">註冊新帳號</h2>
            </div>
            <div class="card-body p-5">
                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="mb-4">
                        <label class="form-label fs-5 fw-bold text-success">我是...</label>
                        <select name="role" class="form-select form-select-lg bg-light" required>
                            <option value="elder">👴 需要被照顧的長者</option>
                            <option value="family">👨‍👩‍👦 負責照顧的家屬/護工</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fs-5">顯示名稱 (您的稱呼)</label>
                        <input type="text" name="display_name" class="form-control form-control-lg bg-light" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fs-5">登入帳號</label>
                        <input type="text" name="username" class="form-control form-control-lg bg-light" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fs-5">登入密碼</label>
                        <input type="password" name="password" class="form-control form-control-lg bg-light" required>
                    </div>
                    <div class="mb-5">
                        <label class="form-label fs-5">聯絡電話 (選填)</label>
                        <input type="text" name="phone" class="form-control form-control-lg bg-light">
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100 fs-4 fw-bold rounded-pill">註冊</button>
                </form>
                <div class="mt-4 text-center">
                    <a href="{{ url_for('auth.login') }}" class="fs-5 text-success text-decoration-none">已有帳號？前往登入</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
